name: Deploy UATO to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages

    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || vars.NEXT_PUBLIC_FIREBASE_API_KEY }}

    defaults:
      run:
        working-directory: ./uapl-lms-flight-log

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate Firebase configuration
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_FIREBASE_API_KEY" ]; then
            echo "::error::NEXT_PUBLIC_FIREBASE_API_KEY is missing. Add it under GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi

          if [[ ! "$NEXT_PUBLIC_FIREBASE_API_KEY" =~ ^AIza[[:alnum:]_-]{20,}$ ]]; then
            echo "::error::NEXT_PUBLIC_FIREBASE_API_KEY is malformed. Save only the raw Firebase Web API key without quotes or variable names."
            exit 1
          fi

      - name: Build static site
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./uapl-lms-flight-log/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
